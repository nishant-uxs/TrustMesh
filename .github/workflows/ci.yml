name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: 1 · Contracts (test + WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2

      - name: Install Stellar CLI
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/stellar/stellar-cli/releases/download/v25.1.0/stellar-cli-25.1.0-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz
          sudo mv stellar /usr/local/bin/stellar
          stellar --version

      - name: Contract unit tests
        run: cargo test --workspace

      - name: Build contract WASM
        run: |
          sed -i 's/\r$//' scripts/build-contracts.sh || true
          bash scripts/build-contracts.sh

      - name: Validate deployments/testnet.json
        run: |
          python3 <<'PY'
          import json
          data = json.load(open("deployments/testnet.json"))
          contracts = data["contracts"]
          required = [
              "organization_registry",
              "reputation",
              "treasury",
              "trust_relationship",
              "trust_relationship_factory",
              "review_verification",
          ]
          assert len(required) == 6, "expected 6 TrustMesh contracts"
          for key in required:
              cid = contracts[key]
              assert isinstance(cid, str) and cid.startswith("C") and len(cid) >= 56, key
              print(f"OK {key}: {cid}")
          print("deploy record OK · 6 contracts")
          PY

      - name: Check deploy scripts present
        run: |
          test -f scripts/deploy.sh
          test -f scripts/deploy.ps1
          test -f scripts/build-contracts.sh
          echo "deploy scripts ready"

  frontend:
    name: 2 · Frontend (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    needs: [contracts]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_RPC_URL: https://soroban-testnet.stellar.org
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
          NEXT_PUBLIC_ORGANIZATION_REGISTRY_ID: CD6AAYZ7IVW6SQDP6NRKRZ3QIRQQPB3ZDRKTSA7ZBU2VRWN4VM4ZNRZT
          NEXT_PUBLIC_REPUTATION_ID: CDYSM4LG4OUPSXGDDSJMZK7H532223GNBAF6I5RAYAFG74HD5QRPRBL5
          NEXT_PUBLIC_TREASURY_ID: CA63C3PLR2GQRNLES6JO72YPFO6HWUYLVWFPZBNY47BRZPYSPUGWMONH
          NEXT_PUBLIC_TRUST_RELATIONSHIP_ID: CBCTIWGKIIGMDMJNPGT4OLVITGTVTW3JFTMHKYBOT42ENZZWEITJLDXJ
          NEXT_PUBLIC_TRUST_RELATIONSHIP_FACTORY_ID: CBF5KOXX34HEF3Q6ECLWQY543V53HJRJ25W5X3DO6O2XII4GP2FHJGHK
          NEXT_PUBLIC_REVIEW_VERIFICATION_ID: CBXOCI2BQTCDUJOVJCAC7TQLBA5HNGVU7UQ5JDLJF44ZHOZBG4PLJ3KF

  deploy-gate:
    name: 3 · Deploy gate
    runs-on: ubuntu-latest
    needs: [contracts, frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Production frontend on Vercel
        run: |
          echo "Live demo: https://trust-mesh-taupe.vercel.app/"
          echo "Pipeline gate passed: 6 contracts + WASM + lint/typecheck/test/build OK."
